<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0E0F11"><title>Keeper · Your song canvas</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="alternate icon" href="/favicon.ico">

<link rel="stylesheet" href="/fonts.css"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/editor.css"><link rel="stylesheet" href="/round3.css"><link rel="stylesheet" href="/processing.css"></head><body>
<aside class="sidebar"><div class="brand-row"><a class="brand" href="/">keeper<span></span></a><button id="sidebar-toggle" class="circle" aria-label="Toggle sidebar" aria-expanded="true"></button><button id="theme" class="circle" aria-label="Switch to light theme"></button></div>
<button id="upload" class="primary upload">Upload memo</button><input id="file" type="file" accept="audio/*,.m4a,.mp4,.aac,.caf,.mp3,.wav,.aif,.aiff,.flac,.ogg,.opus,.webm" hidden>
<p id="upload-limits" class="upload-policy"></p>
<p class="eyebrow">MEMOS</p><nav id="memo-list" aria-label="Memos"></nav><select id="memo-picker" aria-label="Choose memo"></select><p id="browser-privacy" class="upload-policy"></p></aside>
<main><header class="memo-heading"><h1 id="memo-title">Your next song starts here</h1><p id="memo-meta">Upload a voice memo to find your ideas.</p><div id="memo-actions" hidden><button id="rename">Rename</button><button id="delete">Delete</button><input id="rename-input" aria-label="Memo title" hidden></div></header>
<p id="status" role="status" hidden></p><p id="privacy-hint" hidden></p>
<section class="card recording"><div class="card-heading"><button id="record-play" class="circle primary" aria-label="Play Recording"></button><h2>Recording</h2><span class="spacer"></span><span id="record-time" class="mono">0:00 / 0:00</span><label class="detail-label"><input id="show-detail" type="checkbox">Show detail</label><div class="zoom"><button data-zoom="record:-" aria-label="Zoom recording out"></button><button data-zoom="record:fit">Fit</button><button data-zoom="record:+" aria-label="Zoom recording in"></button></div></div>
<div id="record-scroll" class="horizontal"><svg id="timeline" role="img" aria-label="Recording waveform; click to play" tabindex="0"></svg></div></section>
<div class="workspace"><section class="card takes"><div class="card-heading"><h2>Takes</h2><span id="take-count" class="muted"></span></div><div id="filters" class="filters" aria-label="Filter takes"></div><div id="take-list"></div></section>
<section class="card canvas"><div class="card-heading"><div><h2>Canvas</h2><p class="subtitle">Arrange takes into a song and play it through like a demo.</p></div><span class="spacer"></span><div class="zoom"><button data-zoom="canvas:-" aria-label="Zoom canvas out"></button><button data-zoom="canvas:fit">Fit</button><button data-zoom="canvas:+" aria-label="Zoom canvas in"></button></div><button id="play-through" class="primary">Play through</button></div><div id="canvas-scroll" class="horizontal"><div id="canvas-board" tabindex="0" aria-label="Song canvas"><div id="canvas-grid" aria-hidden="true"></div><div id="canvas-ruler"></div><div id="canvas-sections"></div><div id="canvas-clips"></div><div id="canvas-playhead" class="playhead" hidden></div></div></div></section></div>
</main><footer class="transport"><div class="now"><div id="playing-status" aria-live="polite">Nothing playing</div><div id="playing-memo" class="muted"></div></div><div class="transport-center"><div class="transport-buttons"><button id="loop" class="icon" aria-label="Loop playback" aria-pressed="false"></button><button id="prev" class="icon" aria-label="Previous"></button><button id="transport-play" class="circle large" aria-label="Play"></button><button id="next" class="icon" aria-label="Next"></button><button id="stop" class="icon" aria-label="Stop"></button></div><div class="progress"><span id="elapsed" class="mono">0:00</span><input id="seek" aria-label="Playback position" type="range" min="0" max="1" value="0" step=".01"><span id="total" class="mono">0:00</span></div></div><button id="export" hidden>Export</button><p id="ios-hint" hidden>No sound? Check your iPhone's silent switch.</p></footer>
<dialog id="delete-dialog" role="dialog" aria-modal="true" aria-labelledby="delete-title" aria-describedby="delete-body">
<h2 id="delete-title">Delete this memo?</h2><p id="delete-body"></p><p id="delete-error" role="alert" hidden></p>
<div class="dialog-actions"><button id="cancel-delete" autofocus>Cancel</button><button id="confirm-delete" class="danger">Delete</button></div></dialog>
<script src="/wav_encoder.js"></script><script src="/audio_render.js"></script><script src="/audio.js"></script><script id="ios-audio-session">
    "use strict";
    (() => {
      const prototype = window.KeeperPlayer.prototype;
      let silentLoop = null, sessionReady = false, loopState = "unknown", requested = false, attempt = 0;
      function refreshHint() {
        // The existing UI may reveal this on iOS; only retain it if neither route works.
        if (sessionReady || loopState !== "unavailable") document.getElementById("ios-hint").hidden = true;
      }
      function pauseLoop() {
        requested = false; attempt++;
        if (silentLoop) silentLoop.pause();
      }
      function silentWav() {
        // 100 ms of genuine PCM-16 zero samples, mono 16 kHz, at normal element volume.
        const bytes = new Uint8Array(3244), view = new DataView(bytes.buffer);
        for (const [offset, text] of [[0, "RIFF"], [8, "WAVE"], [12, "fmt "], [36, "data"]])
          bytes.set([...text].map(character => character.charCodeAt(0)), offset);
        view.setUint32(4, 3236, true); view.setUint32(16, 16, true);
        view.setUint16(20, 1, true); view.setUint16(22, 1, true);
        view.setUint32(24, 16000, true); view.setUint32(28, 32000, true);
        view.setUint16(32, 2, true); view.setUint16(34, 16, true); view.setUint32(40, 3200, true);
        return "data:audio/wav;base64," + btoa(String.fromCharCode(...bytes));
      }
      function prepareSession() {
        try {
          if (navigator.audioSession) {
            navigator.audioSession.type = "playback";
            if (navigator.audioSession.type === "playback") {
              sessionReady = true; pauseLoop(); refreshHint(); return;
            }
          }
        } catch (_) { /* Unsupported/denied AudioSession uses the media-element route. */ }
        sessionReady = false; requested = true; const current = ++attempt;
        try {
          if (!silentLoop) {
            silentLoop = document.createElement("audio");
            silentLoop.loop = true; silentLoop.volume = 1; silentLoop.muted = false;
            silentLoop.playsInline = true; silentLoop.setAttribute("playsinline", "");
            silentLoop.hidden = true; silentLoop.src = silentWav(); document.body.append(silentLoop);
          }
          loopState = "pending";
          const playing = silentLoop.play(); // Intentionally inside the same user gesture as resume().
          Promise.resolve(playing).then(() => {
            if (current !== attempt) return;
            loopState = "ready"; if (!requested) silentLoop.pause(); refreshHint();
          }).catch(() => { if (current === attempt) { loopState = "unavailable"; refreshHint(); } });
        } catch (_) { loopState = "unavailable"; }
        refreshHint();
      }
      const unlock = prototype.unlock, start = prototype.start, emit = prototype.emit;
      prototype.unlock = function (...args) { prepareSession(); return unlock.apply(this, args); };
      prototype.start = function (...args) {
        // start() stops old buffer sources before its first await; that is not a user stop.
        this.keeperStarting = true;
        try {
          return Promise.resolve(start.apply(this, args)).then(result => {
            // Natural completion must release the loop even when background RAF is throttled.
            const last = this.sources.at(-1), generation = this.generation;
            if (last && this.backend === "web" && this.mode === "playing") {
              last.onended = () => { if (generation === this.generation && this.mode === "playing") this.finish(); };
            }
            return result;
          });
        } finally { this.keeperStarting = false; }
      };
      prototype.emit = function (...args) {
        const result = emit.apply(this, args);
        if ((this.mode === "stopped" && !this.keeperStarting) || ["paused", "ended"].includes(this.mode)) pauseLoop();
        refreshHint(); return result;
      };
    })();
  </script><script src="/icons.js"></script><script src="/ui_helpers.js"></script><script src="/redesign.js"></script><script src="/editor.js"></script><script src="/round3.js"></script><script src="/export.js"></script><script src="/voice.js"></script><script src="/processing.js"></script><script src="/policy.js"></script></body></html>
